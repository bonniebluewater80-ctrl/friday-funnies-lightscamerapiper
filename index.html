<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lights, Camera, Piper!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  --red:#DC2626;--red-dark:#991B1B;--red-deep:#7F1D1D;
  --pink:#FB7185;--pink-mid:#FDA4AF;--pink-light:#FFE4E6;--pink-pale:#FFF1F2;
  --white:#FFFFFF;--off-white:#FAFAFA;--ink:#1C1917;--muted:#78716C;--border:#FECDD3;
}
body{background:var(--pink-light);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;padding:20px 16px 48px}
.page{max-width:640px;margin:0 auto}

/* HEADER */
.header-card{background:linear-gradient(135deg,var(--red) 0%,var(--red-deep) 100%);border-radius:20px 20px 0 0;padding:28px 28px 22px;text-align:center;position:relative;overflow:hidden}
.header-card::before{content:'';position:absolute;top:-40px;right:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08)}
.header-card::after{content:'';position:absolute;bottom:-35px;left:-35px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.06)}
.header-eyebrow{font-size:.63rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--pink-mid);margin-bottom:6px}
.header-title{font-family:'Playfair Display',Georgia,serif;font-size:clamp(2rem,8vw,3.4rem);font-weight:900;color:var(--white);line-height:1;margin-bottom:4px}
.header-title em{font-style:italic;color:var(--pink-mid)}
.header-sub{font-size:.78rem;color:rgba(255,255,255,.7);margin-bottom:18px}
.piper-circle{width:82px;height:82px;border-radius:50%;border:3px solid rgba(255,255,255,.4);object-fit:cover;display:block;margin:0 auto;position:relative;z-index:1;background:#fff}

/* FILM STRIP */
.film-strip{height:22px;background:#1C1917;display:flex;align-items:center;padding:0 6px;gap:5px;overflow:hidden}
.film-hole{width:10px;height:10px;border-radius:2px;background:var(--pink-light);flex-shrink:0}

/* MAIN CARD */
.main-card{background:var(--white);border-radius:0 0 20px 20px;padding:clamp(20px,5vw,36px);box-shadow:0 14px 48px rgba(220,38,38,.13);margin-bottom:16px}

/* PROGRESS */
.progress-wrap{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.progress-bg{flex:1;height:6px;background:var(--pink-light);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--pink));border-radius:99px;transition:width .4s ease}
.progress-meta{font-size:.68rem;font-weight:700;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.score-pill{font-size:.68rem;font-weight:800;background:var(--pink-pale);color:var(--red);padding:3px 11px;border-radius:99px;white-space:nowrap}

/* QUOTE */
.now-playing{font-size:.6rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--pink);display:flex;align-items:center;gap:8px;margin-bottom:14px}
.now-playing::after{content:'';flex:1;height:1px;background:var(--border)}
.quote-card{background:var(--pink-pale);border-radius:14px;padding:20px 22px;margin-bottom:18px}
.big-q{font-family:'Playfair Display',Georgia,serif;font-size:3.5rem;line-height:.75;color:var(--pink-mid);display:block;margin-bottom:6px;user-select:none}
.quote-text{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.1rem,3.5vw,1.55rem);font-style:italic;font-weight:700;color:var(--ink);line-height:1.4}
.quiz-prompt{text-align:center;font-size:.75rem;color:var(--muted);font-weight:700;margin-bottom:14px;text-transform:uppercase;letter-spacing:.09em}

/* CHOICES */
.choices{display:flex;flex-direction:column;gap:10px}
.choice-btn{display:flex;align-items:center;gap:14px;background:var(--white);border:2px solid var(--border);border-radius:12px;padding:13px 16px;cursor:pointer;text-align:left;width:100%;transition:border-color .15s,background .15s,transform .1s;min-height:52px}
.choice-btn:hover,.choice-btn:focus-visible{border-color:var(--red);background:var(--pink-pale);transform:translateY(-1px)}
.choice-btn:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.choice-badge{width:30px;height:30px;border-radius:50%;background:var(--pink-light);color:var(--red);font-size:.68rem;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,color .15s}
.choice-btn:hover .choice-badge{background:var(--red);color:var(--white)}
.choice-name{font-size:clamp(.9rem,2.5vw,1.05rem);font-weight:600;line-height:1.3}

/* REVEAL */
.reveal-sec{text-align:center}
.verdict-pill{display:inline-flex;align-items:center;gap:6px;font-size:.63rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;padding:5px 16px;border-radius:99px;margin-bottom:16px}
.verdict-pill.correct{background:#D1FAE5;color:#065F46}
.verdict-pill.wrong{background:var(--pink-light);color:var(--red-dark)}
.answer-title{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.2rem,3.5vw,1.7rem);font-weight:700;color:var(--ink);margin-bottom:10px}
.explain-text{font-size:.88rem;color:var(--muted);line-height:1.7;margin-bottom:18px;text-align:left}
.piper-box{background:var(--pink-pale);border:2px solid var(--border);border-radius:12px;padding:14px 16px;text-align:left;margin-bottom:20px}
.piper-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.piper-sm{width:40px;height:40px;border-radius:50%;border:2px solid var(--pink-mid);object-fit:cover;flex-shrink:0}
.piper-lbl{font-size:.6rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.piper-txt{font-size:.88rem;font-style:italic;color:var(--ink);line-height:1.55}

/* BUTTONS */
.btn-red{background:var(--red);color:var(--white);border:none;border-radius:99px;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:13px 30px;cursor:pointer;transition:background .15s,transform .1s;display:inline-flex;align-items:center;gap:6px}
.btn-red:hover{background:var(--red-dark);transform:translateY(-1px)}
.btn-outline{background:transparent;color:var(--red);border:2px solid var(--border);border-radius:99px;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:12px 28px;cursor:pointer;text-decoration:none;transition:border-color .15s;display:inline-flex;align-items:center;gap:6px}
.btn-outline:hover{border-color:var(--red)}

/* RESULTS */
.results-card{background:var(--white);border-radius:20px;padding:clamp(24px,5vw,40px);text-align:center;box-shadow:0 14px 48px rgba(220,38,38,.13)}
.score-ring{width:118px;height:118px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--red-deep));border:5px solid var(--pink-mid);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 20px;color:var(--white)}
.score-big{font-family:'Playfair Display',Georgia,serif;font-size:2.2rem;font-weight:900;line-height:1}
.score-denom{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.result-kicker{font-size:.63rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--pink);margin-bottom:8px}
.result-title{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.4rem,4vw,2rem);font-weight:700;color:var(--ink);margin-bottom:10px}
.result-copy{font-size:.88rem;color:var(--muted);line-height:1.7;margin-bottom:20px}
.result-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

.footer-line{text-align:center;font-size:.7rem;color:var(--muted);margin-top:14px;font-style:italic}
.hidden{display:none!important}
</style>
</head>

      <button class="btn-red" id="replayBtn">&#9654; Watch Again</button>
      <a href="https://www.bonniebluewater.com/the-friday-funnies/"
   target="_top"
   rel="noopener"
   style="display:inline-block; padding:14px 28px; border:2px solid #f3a0ad; border-radius:999px; color:#d9272e; text-decoration:none; font-weight:700; text-transform:uppercase; letter-spacing:1px;">

  <p class="footer-line">The Friday Funnies &bull; Starring Piper Bluewater</p>
</div>

<script>
(function(){
  // Build film strip
  var fs=document.getElementById('filmStrip');
  for(var h=0;h<50;h++){var d=document.createElement('div');d.className='film-hole';fs.appendChild(d);}

  var LETTERS=['A','B','C'];
  var current=0, score=0, answered=false;

  var rounds=[
    {quote:"To infinity and beyond!",answer:0,options:["Toy Story","Interstellar","Space Jam"],
     explanation:"Buzz Lightyear's signature battle cry in Toy Story (1995). He said it with complete sincerity every single time.",
     right:"Piper has a Buzz Lightyear toy. She has destroyed it. She still quotes him.",
     wrong:"Piper looked at the screen, looked at you, and slowly walked away."},
    {quote:"We were on a break!",answer:1,options:["Seinfeld","Friends","How I Met Your Mother"],
     explanation:"Ross Geller's eternal defense in Friends — delivered passionately across multiple seasons whether anyone asked or not.",
     right:"Piper would like the record to show she has NEVER been on a break.",
     wrong:"Piper sat through all ten seasons of Friends. She's not angry. Just very tired."},
    {quote:"That's what she said.",answer:0,options:["The Office","Parks and Recreation","Brooklyn Nine-Nine"],
     explanation:"Michael Scott's go-to punchline on The Office — deployed constantly, landed approximately never.",
     right:"Piper acknowledges your comedic awareness. Barely.",
     wrong:"Michael Scott would like a word. So would Piper. Neither conversation will go well for you."},
    {quote:"Nobody puts Baby in a corner.",answer:2,options:["Footloose","Grease","Dirty Dancing"],
     explanation:"Johnny Castle's dramatic entrance at the climax of Dirty Dancing (1987). Still sends people into a full swoon.",
     right:"Piper insists nobody puts HER in a corner either. She has a point.",
     wrong:"Piper has rewatched this scene eleven times today. She expected more from you."},
    {quote:"I'm kind of a big deal.",answer:1,options:["Talladega Nights","Anchorman","Step Brothers"],
     explanation:"Ron Burgundy's humble self-assessment in Anchorman (2004). He also has many leather-bound books.",
     right:"Piper is also kind of a big deal. She and Ron Burgundy would get along dangerously well.",
     wrong:"Ron Burgundy is disappointed. Piper is disappointed. The leather-bound books are disappointed."},
    {quote:"Winter is coming.",answer:0,options:["Game of Thrones","Frozen","The Walking Dead"],
     explanation:"House Stark's sigil words in Game of Thrones — said constantly, as a warning, a mood, and apparently a full personality.",
     right:"Piper knows all about winter. She has a sweater. She also has thoughts about the final season.",
     wrong:"Piper's ears went flat. That's all she has to say."},
    {quote:"You is kind, you is smart, you is important.",answer:2,options:["Steel Magnolias","Forrest Gump","The Help"],
     explanation:"Aibileen Clark's daily affirmation to Mae Mobley in The Help (2011). One of the most quietly powerful lines in modern film.",
     right:"Piper believes this applies to her too. Especially the important part.",
     wrong:"Piper would like Aibileen to know at least one of you got this right."},
    {quote:"I am Groot.",answer:0,options:["Guardians of the Galaxy","Avatar","The Lorax"],
     explanation:"Groot's complete vocabulary in Guardians of the Galaxy (2014) — three words, infinite emotional range.",
     right:"Piper also communicates in a limited vocabulary. She and Groot understand each other.",
     wrong:"I am Groot. (Translation: Piper expected better from you, and so did Groot.)"}
  ];

  function refresh(){
    document.getElementById('sceneLabel').textContent='Scene '+(current+1)+' / '+rounds.length;
    document.getElementById('scoreLabel').textContent='Score: '+score;
    document.getElementById('progressFill').style.width=(((current+1)/rounds.length)*100)+'%';
  }

  function load(idx){
    answered=false;
    var r=rounds[idx];
    refresh();
    document.getElementById('quoteText').textContent=r.quote;
    var c=document.getElementById('choicesEl');
    c.innerHTML='';
    r.options.forEach(function(opt,i){
      var btn=document.createElement('button');
      btn.className='choice-btn';
      btn.type='button';
      btn.innerHTML='<span class="choice-badge">'+LETTERS[i]+'</span><span class="choice-name">'+opt+'</span>';
      btn.addEventListener('click',function(){pick(i,r);});
      c.appendChild(btn);
    });
    document.getElementById('questionView').classList.remove('hidden');
    document.getElementById('revealView').classList.add('hidden');
    document.getElementById('nextBtn').textContent=idx<rounds.length-1?'Next Scene →':'See Results →';
  }

  function pick(sel,r){
    if(answered)return;
    answered=true;
    var ok=sel===r.answer;
    if(ok)score++;
    document.querySelectorAll('.choice-btn').forEach(function(btn,i){
      btn.style.pointerEvents='none';
      var badge=btn.querySelector('.choice-badge');
      if(i===r.answer){
        btn.style.borderColor='#16A34A';btn.style.background='#F0FDF4';
        if(badge){badge.style.background='#16A34A';badge.style.color='#fff';}
      } else if(i===sel&&!ok){
        btn.style.borderColor='#DC2626';btn.style.background='#FFF1F2';
        if(badge){badge.style.background='#DC2626';badge.style.color='#fff';}
      }
    });
    setTimeout(function(){
      document.getElementById('questionView').classList.add('hidden');
      document.getElementById('revealView').classList.remove('hidden');
      var v=document.getElementById('verdictEl');
      v.textContent=ok?'✓ Cut! That\'s a take.':'✕ Not quite.';
      v.className='verdict-pill '+(ok?'correct':'wrong');
      document.getElementById('answerEl').textContent=r.options[r.answer];
      document.getElementById('explainEl').textContent=r.explanation;
      document.getElementById('piperEl').textContent=ok?r.right:r.wrong;
      document.getElementById('scoreLabel').textContent='Score: '+score;
    },500);
  }

  function next(){
    current++;
    if(current>=rounds.length){wrap();}else{load(current);}
  }

  function wrap(){
    document.getElementById('gameCard').classList.add('hidden');
    var rc=document.getElementById('resultsCard');
    rc.classList.remove('hidden');
    document.getElementById('finalScore').textContent=score;
    var t,c;
    if(score===8){t="Oscar-Worthy Performance.";c="A perfect score. Piper is genuinely impressed, and she is not easily impressed. You clearly know how to spend a Friday night.";}
    else if(score>=6){t="Strong Supporting Role.";c="Very solid. Piper gives you a proper tail wag — the real kind, not the polite one she does for strangers.";}
    else if(score>=4){t="Needs More Rehearsal.";c="A respectable middle. Piper is giving you the look she gives the TV when something almost makes sense. More movie nights recommended.";}
    else if(score>=2){t="Deleted Scene Energy.";c="You tried. Piper sees that. She respects effort even when the results are a work in progress.";}
    else{t="Have You Tried Watching Movies?";c="Piper is concerned. Not angry — just concerned. She is personally curating a watchlist for you. It starts with Toy Story.";}
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultCopy').textContent=c;
  }

  document.getElementById('nextBtn').addEventListener('click',next);
  document.getElementById('replayBtn').addEventListener('click',function(){
    current=0;score=0;answered=false;
    document.getElementById('resultsCard').classList.add('hidden');
    document.getElementById('gameCard').classList.remove('hidden');
    load(0);
  });

  load(0);
})();
</script>
